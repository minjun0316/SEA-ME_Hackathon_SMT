# Camera configuration
USB_CAM: true
MIPI_CAM: false
USB_CAM_DEVICE: /dev/video1
IMAGE_WIDTH: 320
IMAGE_HEIGHT: 160
# 센서 캡처 해상도(=수평 화각 결정). C920은 16:9 센서라 4:3로 캡처하면 좌우가
# 잘린다. 16:9로 캡처해 곡선에서 양쪽 차선 화각 확보. 출력은 IMAGE_*로 리사이즈.
CAPTURE_WIDTH: 640
CAPTURE_HEIGHT: 360
# 실시간성(4코어 CPU 경합 완화): 카메라 발행 주기. 30→15로 lane_detect·모니터 부하
# 절반. lane_timeout(0.3s) 대비 15fps(66ms)는 충분히 안전.
CAMERA_PUBLISH_HZ: 15
ROI_TOP: 50
ROI_LEFT: 0

# Vehicle control parameters
STEER_TRIM: 0.2238

# Web server configuration
WEB_HOST: 0.0.0.0
WEB_PORT: 5000
BATTERY_TOPIC: /battery_status
IMAGE_TOPIC: /camera/image/compressed
CONTROL_TOPIC: /control
JOYSTICK_TOPIC: /joystick
STORAGE_PATH: /
IMAGE_DISPLAY_WIDTH: 640
IMAGE_DISPLAY_HEIGHT: 480
OPENCV_DEBUG_MODE : true

# 모니터 디버그 그리드에 표시할 화면들(라벨 + CompressedImage 토픽).
# 여기에 한 줄 추가하면 웹 UI 디버그 패널이 자동 생성된다(재빌드 없이 노드 재시작만).
# OPENCV_DEBUG_MODE 가 true 여야 그리드가 보인다. DEBUG_CHANNELS 를 지우면
# 기존 opencv 3종(grayscale/blur/edge)으로 자동 폴백한다.
#
# 채널 수 = 브라우저가 동시에 당기는 영상 스트림 수. 메인(camera)+디버그 합이 브라우저
# 동시연결 한계(~6)를 넘으면 뒤쪽 패널이 굶어 안 뜬다(07-10). 그래서 라이브로 꼭 보는
# 것만 남긴다: Lane / Lane Edge / YOLO (+메인=4스트림). grayscale/blur/edge는 필요 시
# 아래 한 줄씩 되살리면 됨(발행은 계속되므로 웹 표시 여부만 바뀜).
DEBUG_CHANNELS:
  - {label: "Lane",      topic: "/perception/lane/debug/compressed"}
  - {label: "Lane Edge", topic: "/perception/lane/debug/edges/compressed"}
  - {label: "YOLO",      topic: "/perception/test/yolo_detect/debug/compressed"}