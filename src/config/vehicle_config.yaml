# Camera configuration
USB_CAM: true
MIPI_CAM: false
# [07-15] /dev/video1 → by-id 고정경로. USB 재연결/재부팅 때마다 리눅스가 꽂힌 순서대로
# 번호를 매겨 장치 번호가 밀린다(C920이 video1→video2로 이동해 카메라 열기 실패했음).
# by-id는 카메라 이름 기반이라 번호가 밀려도 항상 같은 장치를 가리킨다(재발 방지).
#   확인: ls -l /dev/v4l/by-id/    (index0=캡처용, index1=메타데이터라 index0을 쓴다)
#   카메라를 바꾸면 이 경로도 바뀌니 위 명령으로 새 이름 확인 후 갱신할 것.
USB_CAM_DEVICE: /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920-video-index0
IMAGE_WIDTH: 320
IMAGE_HEIGHT: 160
# 센서 캡처 해상도(=수평 화각 결정). C920은 16:9 센서라 4:3로 캡처하면 좌우가
# 잘린다. 16:9로 캡처해 곡선에서 양쪽 차선 화각 확보. 출력은 IMAGE_*로 리사이즈.
CAPTURE_WIDTH: 640
CAPTURE_HEIGHT: 360
# 실시간성(4코어 CPU 경합 완화): 카메라 발행 주기. 07-12 15→20 안착(25도 됐으나 미션
# 후반 YOLO 부하로 짧아질 우려에 20 유지, 여유되면 나중 상향—한 줄+노드재시작이라 즉시).
# 캡처 30fps라 30이 천장. lane_path는 카메라 fps 종속. lane_timeout(0.3s) 대비 20fps 안전.
CAMERA_PUBLISH_HZ: 20
ROI_TOP: 50
ROI_LEFT: 0

# Vehicle control parameters
STEER_TRIM: 0.2238

# ESC 스로틀 데드밴드 보상 (control_node → d3racer).
# ESC는 중립(1500µs) 위로 일정 폭까지 모터가 안 돈다(죽은 구간). 선형 매핑은 이
# 구간에 스로틀 하위 영역을 통째로 버려 저속이 안 나간다(0.35까지 올려야 겨우 감).
# 아래는 '전진에서 모터가 실제로 도는 최소 펄스[µs]' — p→0+ 를 이 펄스로 매핑해
# 작은 throttle에도 바로 구동. 실측(스로틀 조금씩↑, 바퀴가 처음 도는 값)으로 튜닝.
#   1500 = 보상 off(기존 선형). 저속 안 나가면 ↑, 저속이 너무 빠르면 ↓.
# [07-15 바닥 실측, 배터리 61.4%] 1650 → 1575. 절차: docs/calibration.md 3-b절.
#   보상 off(1500) 상태에서 pulse = 1500 + p×500 로 재니:
#     떼는 값 p_break  = 0.15 → 1575µs (0.14=1570µs는 정지에서 출발 못 함)
#     유지 최저 p_sustain = 0.14 → 1570µs (0.13=1565µs에서 멈춤)
#   둘이 5µs 차 = 정지마찰 여유 없음 → 1575µs가 이 차의 물리적 최저 주행 펄스다.
#   기존 1650은 그보다 75µs 위 = p→0+ 가 이미 최저속을 한참 넘겨서 "0.05만 줘도
#   튀어나오는" 원인이었다. (yaml 옛 주석의 "0.35까지 올려야 겨우 감"=1675µs는
#   실측과 100µs나 어긋난다 — 거치대에서 쟀거나 잘못된 값으로 보고 폐기.)
# ⚠ 이 값은 배터리 61.4%에서 잰 것이다. 충전량이 오르면 같은 펄스가 더 빨라지고,
#   내리면 1575로 출발이 안 될 수 있다(그땐 5~10µs씩 ↑). 근본 해결은 펄스단
#   배터리 보정이며 아직 미구현 — docs/calibration.md 3-b 참조.
THROTTLE_FWD_START_US: 1575
THROTTLE_REV_START_US: 1500   # 후진(미사용). 필요 시 후진 시작 펄스로 조정.

# Web server configuration
WEB_HOST: 0.0.0.0
WEB_PORT: 5000
BATTERY_TOPIC: /battery_status
IMAGE_TOPIC: /camera/image/compressed
CONTROL_TOPIC: /control
JOYSTICK_TOPIC: /joystick
STORAGE_PATH: /
IMAGE_DISPLAY_WIDTH: 640
IMAGE_DISPLAY_HEIGHT: 480
OPENCV_DEBUG_MODE : true

# 모니터 디버그 그리드에 표시할 화면들(라벨 + CompressedImage 토픽).
# 여기에 한 줄 추가하면 웹 UI 디버그 패널이 자동 생성된다(재빌드 없이 노드 재시작만).
# OPENCV_DEBUG_MODE 가 true 여야 그리드가 보인다. DEBUG_CHANNELS 를 지우면
# 기존 opencv 3종(grayscale/blur/edge)으로 자동 폴백한다.
#
# 채널 수 = 브라우저가 동시에 당기는 영상 스트림 수. 메인(camera)+디버그 합이 브라우저
# 동시연결 한계(~6)를 넘으면 뒤쪽 패널이 굶어 안 뜬다(07-10). 그래서 라이브로 꼭 보는
# 것만 남긴다: Lane / Lane Edge / YOLO (+메인=4스트림). grayscale/blur/edge는 필요 시
# 아래 한 줄씩 되살리면 됨(발행은 계속되므로 웹 표시 여부만 바뀜).
DEBUG_CHANNELS:
  - {label: "Lane",      topic: "/perception/lane/debug/compressed"}
  - {label: "Lane Edge", topic: "/perception/lane/debug/edges/compressed"}
  - {label: "YOLO",      topic: "/perception/test/yolo_detect/debug/compressed"}