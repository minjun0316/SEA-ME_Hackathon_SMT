# YOLO26n-seg 데이터셋 설정 (파인튜닝용)
#
# 데이터 폴더(YOLOv26n_seg/datasets/)는 대용량이라 gitignore 됩니다.
# 각자 노트북에서 데이터셋을 만들어 아래 구조로 배치하세요.
#
# 폴더 구조 예시:
#   YOLOv26n_seg/
#     datasets/
#       images/train/   images/val/     ← 이미지(.jpg/.png)
#       labels/train/   labels/val/     ← YOLO seg 라벨(.txt, 폴리곤 좌표)
#
# 이 파일(dataset.yaml) 기준의 상대경로로 적습니다.

path: ../datasets          # dataset.yaml 위치 기준 데이터 루트
train: images/train        # 학습 이미지 폴더 (path 기준 상대)
val: images/val            # 검증 이미지 폴더 (path 기준 상대)

# ─── 클래스 정의 (우리 대회에 맞게 수정) ───
names:
  0: lane          # 예: 차선
  1: obstacle      # 예: 장애물
  # 필요한 만큼 추가하세요. 라벨링한 클래스와 순서·번호가 정확히 일치해야 합니다.
