# @file controller.yaml
# @brief 제어기 튜닝 파라미터 (Pure Pursuit / Speed / Battery).
#
# State Machine(Stage 6)은 상태별로 이 값들 중 lookahead/speed/조향제한만
# 바꾼다. 컨트롤러 자체는 모든 상태에서 동일하다.

pure_pursuit:
  use_adaptive_lookahead: true  # 07-10 재활성: 07-09 발산원인(생 곡률로 Ld 축소)을 코어에서 제거 — compute_lookahead가 이제 _smooth_kappa의 κ_eff(EMA+데드밴드)를 써 직선 노이즈가 Ld를 못 줄인다. 고정 Ld 0.6은 직선OK지만 곡선 코너컷/탈출 진동 → adaptive로 곡선서 Ld 단축(민첩+빠른정착). 주 레버는 속도항(kv): 직선 빠름→길게, 곡선 감속→짧게(속도컨트롤러가 곡선 감속하므로 신뢰도 높음). 발산 재발 시 kc/steering_gain 낮추거나 fixed로 폴백.
  fixed_lookahead: 0.6          # 0.55→0.6(07-10 실측후): /perception/lane_path 실측 15.0Hz(std 0.002s=카메라 프레임레이트에 고정, detect는 여유). 제어루프 30Hz 튜닝(0.55)의 절반 신선도라 지연 τ 33→66ms(2배)→저댐핑 꿀렁. Ld↑로 위상여유 확보 & 크로스트랙게인 2L/Ld²도 (0.55/0.6)²=0.84배로 낮춰 앞선 +62% 부스트 일부 상쇄(이중효과). 여전히 꿀렁이면 0.65, 커브 코너컷 생기면 0.55복귀+steering_gain 0.75→0.65로 대체. 근본치료는 카메라 15→30fps(팀원 소유). ▷이전: 0.7→0.55(rate 30Hz 후) S자는 지연 리밋사이클이라 rate↑로 소멸, 크로스트랙게인 0.53→0.87 회복. (10Hz땐 0.6이 S자였으나 rate 다름)
  # Adaptive: Ld = ld_min + kv*speed - kc*|curvature|, [ld_min, ld_max]로 clip.
  ld_min: 0.45                  # 최소 lookahead(=곡선 Ld) [m]. 곡선서 여기로 수렴. 0.45(07-09 max_steer 15.5° 정정 후 코너컷 여유). 실차서 커브 코너컷/못돌면 0.4로, 곡선서 떨면 0.5로.
  ld_max: 1.2                   # 최대 lookahead [m]. 너무 크면 코너 컷(corner cut).
  kv: 0.2                       # 속도 이득 [s]. 0.17→0.2 복귀(07-10 preview 도입 후): kv 낮춰 턴인 늦추기(직선 Ld까지 같이 줄어 꿀렁)는 한계 도달 → 턴인은 이제 curvature_preview가 담당. 그래서 kv는 직선 Ld=0.45+0.2·0.8=0.61로 되돌려 직선 감쇠(꿀렁↓) 강화. 직선 굼뜨면 ↑, 직선 떨면 preview는 그대로 두고 여기 ↓.
  kc: 0.3                       # 곡률 이득 [m^2]. 0.2→0.3: preview로 곡선 미리 볼 때 접근 Ld 수축 깊이↑=턴인 더 지연(계속 먼저 꺾어서). 곡선 코너컷이면 ↑, 곡선서 떨면 ↓.
  # preview: adaptive/gain 곡률을 nearest 대신 전방 preview[m] 구간 max|κ|로 읽음. 곡선 진입 전 Ld 수축→턴인 지연(직선 Ld 무영향). 진입 타이밍↔직선Ld 분리.
  curvature_preview: 0.9        # 07-10: 0.6→0.9(계속 먼저 꺾어서). 전방 0.9m 곡률을 봐 진입 전 Ld 수축→턴인 지연. 직선(preview 안에 곡선 없음)은 Ld 길게 유지. ⚠️인지 lane_path가 이보다 짧으면(전방 도달거리<0.9m) 효과 제한 — 경로 길이 실측 필요. 진입이 너무 늦어 코너컷이면 ↓(0.6), 0이면 nearest만.
  steering_gain: 0.75           # 07-10: 곡률게인 OFF, 상수로 복귀. lookahead 0.75와 함께 실효게인 2L/Ld²·g≈0.47. 직선 발산 잡는 게 우선. 아직 진동하면 0.65로, 굼뜨면 0.85로.
  steering_smoothing: 0.2       # 신규 명령 가중치 β. out=(1-β)*old+β*new. 작을수록 부드럽고 느림(damping↑) BUT 위상지연↑ → 폐루프 발산 시엔 오히려 독. 0.12(07-09 낮췄다가 S자발산 의심)→0.2 복귀: 지연 축소 우선. 노이즈 떨림만 남으면(발산 아님) 0.15로.
  search_window: 60             # 전방 최근접 탐색 윈도우(점 개수). 자기교차/되돌아오는 경로 안정화. 0=전역탐색.
  # 곡률 스케줄 gain: gain = clip(steering_gain + steering_gain_kappa*κ_eff, steering_gain, steering_gain_max).
  # κ_s=EMA(|κ|), κ_eff=max(0, κ_s - curvature_deadband). 직선 gain 낮게/커브 gain 높게 자동 전환.
  use_curvature_gain: false     # 07-10: 직선 발산 유발로 OFF. 원인=직선 지터가 가짜 곡률→gain↑→진동↑→곡률 더 크게 읽힘→gain↑ (양의 피드백=발산). 직선 안정 확보 후 커브는 adaptive lookahead로 대체(피드백 고리 없음). 재활성 시 deadband 크게+smoothing 작게 필수.
  steering_gain_kappa: 0.25     # |κ_eff| 계수. 커브서 gain 가산량. 커브 못돌면(run wide) ↑, 커브서 파고들면 ↓. 예상 커브 κ≈0.8~1.7(R 0.6~1.2m).
  steering_gain_max: 1.0        # 곡률 가산 후 gain 상한. 과조향 방지.
  curvature_deadband: 0.3       # 이하 |κ_s|는 직선 취급(gain=baseline). 직선을 곡률 노이즈로부터 격리. 직선서 gain이 들썩이면 ↑, 완만커브 반응 느리면 ↓.
  curvature_smoothing: 0.3      # 곡률 EMA α: κ_s=(1-α)κ_s+α|κ|. 작을수록 강한 저역통과(노이즈↓·지연↑). 직선 gain 떨림 심하면 0.2로.

speed:
  v_max: 0.8                    # 직선 최대 속도(정규화 또는 m/s).
  v_min: 0.3                    # 급커브 최소 속도.
  curvature_gain: 0.5          # |κ| 1당 감속량. v = v_max - gain*|κ|.
  use_speed_pid: false          # 운동학 시뮬은 false. 실차 throttle↔속도 보정 시 true.
  kp: 0.5
  ki: 0.0
  kd: 0.0

# --- 근거리 차선오차 PD(+heading) 횡제어 (lateral_controller:=lateral_pd 일 때 사용) ---
# Pure Pursuit의 먼 룩어헤드(BEV 원거리 노이즈 증폭) 대신 인지의 근거리 신호
# lateral_offset[m]+heading_error[rad]만 씀. 직선 꿀렁이 PP보다 확실히 적음(07-10 실차 A/B 확인).
# δ = sign·(k_cross·offset + k_heading·heading + k_deriv·d(offset)/dt), +트림+smoothing.
lateral_pd:
  steering_sign: 1.0            # +1=+오차→좌회전(D-Racer). ⚠️거치대서 반대로 꺾이면 -1로. 실차 첫 구동 전 방향 확인.
  # 곡률 피드포워드(07-12 신규): 커브 유지 조향을 오차 없이 미리 얹어 순수PD의 정상상태
  # 오차(커브서 중심 못잡음) 제거. κ는 lane_path 근거리에서 부호 있게 유도(좌+/우−).
  # lane_path 끊기면 κ=0로 폴백(순수PD로 안전 degrade). k_ff=0이면 완전 off(기존 동작).
  k_ff: 0.1                    # 부호곡률 κ[1/m]→조향 이득. 0=off. 0.0→0.1(07-14 실차 확정: 커브 안쪽 붙음). 과하면 커브서 안쪽 파고듦(cut-in)→↓.
  curvature_smoothing: 0.5     # κ EMA α. 0.3→0.5(07-12: 커브 exit서 κ 빨리 식혀 k_cross 부스트 잔상 제거=직선 복귀 빠르게). 작을수록 강한 저역통과(노이즈↓·지연↑). 직선서 ff 떨면 ↓.
  curvature_deadband: 0.4      # 이하 |κ_s|는 직선 취급(ff=0). 직선 곡률노이즈 격리. 0.15→0.1→0.4(07-13 실차). 직선서 ff 들썩이면 ↑, 완만커브 반응 늦으면 ↓.
  curvature_preview: 0.1       # 차량 앞 이 거리[m]의 부호곡률 평균을 ff/스케줄로. 0.38→0.3→0.1(07-13 실차). ⚠️lane_path 도달거리보다 짧아야 의미. 커브 진입 늦으면 ↑(먼저 봄), 너무 이르면 ↓.
  k_cross: 0.47                # offset[m]→조향(직선 baseline). 차선중심 복귀 P. 0.45→0.40→0.47(07-14 실차 확정). 커브 중심복귀는 아래 k_cross_kappa가 담당(직선은 이 값 그대로). 직선 꿀렁이면 ↓.
  # k_cross 곡률 스케줄(07-12): k_cross=0.8 상수로 커브 중심은 잡았으나 직선 꿀렁 심해짐 →
  # 직선(κ_eff=0)은 baseline 0.4 유지, 커브(κ_eff↑)만 부스트로 분리. κ는 lane_path 기하(조향 아님)
  # + 데드밴드로 직선 격리라 PP 곡률게인식 발산 없음. k_cross_eff = min(k_cross + k_cross_kappa·|κ_eff|, k_cross_max).
  k_cross_kappa: 0.85          # |κ_eff|당 k_cross 가산. 0.75→0.85(07-14 실차 확정). 커브 κ_eff≈0.7~1.5면 +0.6~1.28 → 커브 k_cross≈1.2(max컷). 커브 중심 못잡으면 ↑, 커브서/exit서 떨면 ↓.
  k_cross_max: 1.2             # 스케줄 k_cross 상한. 급커브서 과조향 방지.
  # [07-16b] 0.28→0.5→0.33(07-14: 0.5는 미리 꺾어 3번커브 이탈 → 조기조향 완화)→**0.30**.
  # 07-16b 실차에서 구간 분기(아래 lateral_pd_post_sign) 넣고 "많이 괜찮아졌다" 확인 후,
  # 팻말 前(S자) 구간의 조기조향을 한 스텝 더 완화. ψ가 경로 끝점(차 앞 ~97cm)까지의 현
  # 각도라 S자에서도 선반영이 과하면 안쪽으로 파고든다. -9%로 아주 약간만 움직였다.
  # ⚠ 이 값은 **팻말 전 + 분기 중(SIGN_BRANCH)** 에 걸린다(둘 다 DEFAULT 프로파일).
  #   분기 기동이 미세하게 소심해질 수 있다 — 분기가 덜 꺾이면 여기가 원인 후보다.
  # 파고들면 ↓(0.28=07-14에 쓰던 값이 하한 참고), 런와이드/위빙이면 ↑(0.33 복귀).
  k_heading: 0.30              # heading[rad]→조향(팻말 前 baseline). 파고들면 ↓, 런와이드면 ↑.
  k_deriv: 0.05                # d(offset)/dt 댐핑(선택). 0.05→0.0→0.05(07-14 실차 확정: 소량 댐핑 복귀). 노이즈 심해지면 ↓, 꿀렁 남으면 ↑.
  deriv_smoothing: 0.3         # 미분 EMA(노이즈 저역통과). k_deriv 쓸 때만 의미. (k_deriv=0.05로 활성)
  max_offset: 0.5             # offset 클램프[m]. 오검출 스파이크→과조향 방지.
  steering_smoothing: 0.45     # 출력 β: out=(1-β)old+β new. 작을수록 부드럽(지연↑). 0.3→0.55→0.45(07-14 실차 확정: 전환속도↔직선안정 균형점). 직선 떨면 ↓, 굼뜨면 ↑.

# --- [07-16b] 팻말 분기 후 구간 전용 게인 세트 (계약 §4.4 DriveCommand.gain_profile) ---
# 코스: 팻말 前 = S자(곡률 연속) / 팻말 後 = **직선-ㄱ자-직선-ㄱ자**(곡률이 계단처럼 튐).
# 한 세트로 둘 다 만족 못 한다 — k_heading 0.28→0.5→0.33 이력이 그 증거다(0.5는 S자엔
# 좋았지만 커브서 미리 꺾어 이탈, 0.33은 그 타협). 판단이 팻말 분기를 마치면
# PROFILE_POST_SIGN을 지시하고, 제어가 이 블록으로 게인을 갈아끼운다(내부 EMA는 유지).
#
# ⚠ 여기 **안 적은 키는 위 lateral_pd 값을 그대로 상속**한다. baseline을 튜닝하면 이 구간도
#   같이 따라오므로 두 블록이 갈라지지 않는다. 구간별로 다르게 갈 값만 적을 것.
# ⚠ CLI 오버라이드(pd_k_heading:= 등)는 **양 프로파일에 다 걸린다**(스윕 도구라 그렇다).
#   구간별로 다르게 주려면 CLI가 아니라 이 YAML을 써야 한다.
# 되돌리려면 이 블록을 통째로 지우거나 mission.yaml post_sign_profile_enable: false.
lateral_pd_post_sign:
  # ψ(heading_error)는 접선이 아니라 **경로 끝점(차 앞 ~97cm)까지의 현 각도**라 1m 앞을
  # 미리 본다. 곡률이 연속인 S자에선 이 선반영이 이득이지만, ㄱ자에선 차가 아직 직선인데
  # 경로 끝만 코너를 돌아 ψ가 커져 **코너 1m 전부터 조향이 걸린다** → 라인 이탈(07-16 실차).
  # 0.231 — 07-16b 실차에서 "많이 괜찮아졌다"로 검증된 값.
  # ⚠ 처음엔 baseline 0.33의 **0.7배**로 유도했지만, 그 뒤 baseline이 0.30으로 내려가
  #   그 비율은 더 이상 성립하지 않는다(지금은 0.77배). **비율이 아니라 절대값**으로
  #   읽을 것 — 실차로 검증된 건 0.231이지 "0.7배"가 아니다. baseline을 또 움직여도
  #   여기는 따라가지 않는다(명시 오버라이드라 상속에서 빠진다 = 의도된 것).
  # 아직 미리 꺾으면 ↓(0.20), 코너서 바깥으로 밀리거나(런와이드) 직선이 꿀렁이면 ↑(0.26).
  k_heading: 0.231
  # ⚠ k_heading은 위빙 억제 **주감쇠** 항이다(k_deriv가 작아 감쇠를 이게 거의 혼자 한다).
  # 위에서 그 감쇠를 23%(0.30→0.231) 깎았으니 여기서 되산다. 안 그러면 꿀렁임이 오히려 는다.
  # 0.05 → 0.10. 꿀렁 남으면 ↑, 근거리 미분 노이즈로 조향이 지글거리면 ↓.
  k_deriv: 0.10
  # "안정화가 빨라야 한다" = 출력 지연을 줄인다. ㄱ자가 둘 연달아 나와 전환이 잦다.
  # 0.45 → 0.55. 굼뜨면 ↑, 직선서 떨면 ↓.
  steering_smoothing: 0.55
  # ⚠ k_cross(중심복귀 P)는 **일부러 baseline 0.47 그대로 상속**한다. 꿀렁인다고 이걸
  #   내리면 복귀력이 약해져 안정화가 오히려 **느려진다**(꿀렁↓ 하나만 얻고 목표 절반을
  #   잃는다). 꿀렁은 복귀력이 아니라 감쇠(k_deriv)로 잡는 게 맞다.

# --- 정지선 카운트 → 개루프 고정스티어 기동 (로터리 진입/탈출) ---
# on/off는 운영 플래그라 controller_node ROS 파라미터(런치 인자) stopline_maneuver:=True 로 켠다.
# 1번째 정지선→우 고정스티어 duration_sec, 2번째→좌 고정스티어(탈출). 개루프라 회전 중
# 차선 놓쳐도 시간만큼 그대로 돈다(아루코 정지 게이트는 안전상 유지). @see core/planning/stopline_maneuver.py
stopline_maneuver:
  steer: 0.35        # 고정 조향 크기(정규화, 트림 전 raw). "조금". ⚠️실차 첫 튜닝 1순위 — 커브 못 돌면 ↑, 과회전이면 ↓.
  duration_sec: 1.5  # 기동 유지 시간[s]. 회전 덜 되면 ↑, 지나치면 ↓.
  first_dir: -1.0    # 1번째 정지선 방향(-1=우회전).
  second_dir: 1.0    # 2번째 정지선 방향(+1=좌회전, 탈출).
  debounce_sec: 1.5  # 정지선 카운트 최소 간격[s](한 정지선 중복 카운트 방지).
  max_count: 2       # 이 카운트까지만 기동(이후 정지선 무시).

battery:
  enabled: false                # 배터리 토픽(/battery_status) 연동 시 true.
  v_nominal: 7.4                # 공칭 전압 [V] (2S LiPo).
  v_min: 6.4                    # 보정 하한 [V].
  v_max: 8.4                    # 보정 상한 [V].
  max_gain: 1.5                 # 보정 배수 상한(과보상 방지).
  lookup_table: []              # [[V, gain], ...] 지정 시 수식 대신 LUT 보간.
