# @file controller.yaml
# @brief 제어기 튜닝 파라미터 (Pure Pursuit / Speed / Battery).
#
# State Machine(Stage 6)은 상태별로 이 값들 중 lookahead/speed/조향제한만
# 바꾼다. 컨트롤러 자체는 모든 상태에서 동일하다.

pure_pursuit:
  use_adaptive_lookahead: false # 07-09: 실차 직선서 S자 발산(폐루프 불안정). adaptive는 노이즈 path를 가짜 곡률로 읽어 Ld를 줄임→더 신경질적→악순환. 안정 확보까지 고정 lookahead 사용(악순환 차단). 안정되면 true로 되돌리며 kc 낮춰 재시도.
  fixed_lookahead: 0.6          # use_adaptive_lookahead=false일 때 사용 [m]. 길수록 직선 안정(jitter Δy가 타깃각에 덜 반영)·커브 코너컷↑. 발산하면 0.7~0.8, 커브 못돌면 0.5.
  # Adaptive: Ld = ld_min + kv*speed - kc*|curvature|, [ld_min, ld_max]로 clip.
  ld_min: 0.45                  # 최소 lookahead [m]. 너무 작으면 진동. 0.3→0.4(20°때 코너컷 원복)→0.45(07-09): max_steer 15.5° 정정으로 이제 잘 꺾여 코너컷 여유↑. 직선 jitter 대응 핵심 레버 — 길수록 차선 흔들림 Δy가 타깃각 α=atan2(Δy,Δx)에 덜 반영돼 조향 둔감. 시뮬 커브 완주 유지(sharp_s RMS 2.0→~3.5cm). 실차서 커브 코너컷/못돌면 0.4로.
  ld_max: 1.2                   # 최대 lookahead [m]. 너무 크면 코너 컷(corner cut).
  kv: 0.4                       # 속도 이득 [s]. 빠를수록 멀리 본다 → 안정.
  kc: 0.1                       # 곡률 이득 [m^2]. 곡률 클수록 가까이 본다 → 민첩.
  steering_gain: 1.0            # 출력 보정. 1.3→1.1→0.9(07-08, max_steer 10° 오류를 억지로 누르던 값)→1.0(07-09): max_steer_deg 10→20° 정정으로 과조향 근본 해결됨. 20°에서 gain 스윕(수신지평선 시뮬 R=1.2m): 0.9=CTE1.06cm, 1.0=0.33cm(최적), 1.1=0.52cm. 실차서 바깥으로 부풀면 1.1, 안쪽 파고들면 0.9.
  steering_smoothing: 0.2       # 신규 명령 가중치 β. out=(1-β)*old+β*new. 작을수록 부드럽고 느림(damping↑) BUT 위상지연↑ → 폐루프 발산 시엔 오히려 독. 0.12(07-09 낮췄다가 S자발산 의심)→0.2 복귀: 지연 축소 우선. 노이즈 떨림만 남으면(발산 아님) 0.15로.
  search_window: 60             # 전방 최근접 탐색 윈도우(점 개수). 자기교차/되돌아오는 경로 안정화. 0=전역탐색.

speed:
  v_max: 0.8                    # 직선 최대 속도(정규화 또는 m/s).
  v_min: 0.3                    # 급커브 최소 속도.
  curvature_gain: 0.5          # |κ| 1당 감속량. v = v_max - gain*|κ|.
  use_speed_pid: false          # 운동학 시뮬은 false. 실차 throttle↔속도 보정 시 true.
  kp: 0.5
  ki: 0.0
  kd: 0.0

battery:
  enabled: false                # 배터리 토픽(/battery_status) 연동 시 true.
  v_nominal: 7.4                # 공칭 전압 [V] (2S LiPo).
  v_min: 6.4                    # 보정 하한 [V].
  v_max: 8.4                    # 보정 상한 [V].
  max_gain: 1.5                 # 보정 배수 상한(과보상 방지).
  lookup_table: []              # [[V, gain], ...] 지정 시 수식 대신 LUT 보간.
