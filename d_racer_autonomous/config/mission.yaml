# @file mission.yaml
# @brief 상위 미션 시퀀스(MissionSequencer) 파라미터.
#
# 흐름(07-14 흰선 폐루프): 초록불 대기 → S자 흰선 주행 → 방향 팻말 분기 → 흰선 주행
#   → 동적장애물(아루코 정지/재출발) → 빨간불 종료. 지름길(노랑)·로터리·체커보드 폐기.
# 시퀀스: docs/mission_fsm.md

mission:
  # --- 구간별 배율 ---
  slow_speed_scale: 0.5             # 장애물 구역 등 감속 구간 속도 상한 배율.
  # --- YOLO 추론 게이트 ---
  # true: 페이즈별 YOLO on/off (출발/빨간불 종료만 신호등 YOLO ON, 주행 구간 OFF로 FPS 확보).
  #       장애물 구역서 아루코 최초 검출 시 ON 래치 → 빨간불 종료까지 유지.
  #       팻말 YOLO(sign_enable)는 SIGN_BRANCH에서만 ON(독립).
  # false: 게이트 끔 = 신호등 YOLO 항상 ON(기존 동작). 디버깅/전 구간 인지 필요 시.
  yolo_gate_enable: true
  # --- 방향 팻말 분기(SIGN_BRANCH) — 07-15 밤 재설계 ---
  # 팻말 YOLO가 좌/우를 확실히(conf≥mission_cues.sign_min_conf=0.8) 읽으면 진입 → 방향
  # 래치 → turn_hint로 인지에 **앵커 차선**을 지시(lane.yaml sign_apply=anchor: 그쪽 선
  # 하나만 슬라이딩윈도우 + 차선폭/2 → 통로 중앙). 고정 조향 bias(오픈루프)는 폐기 —
  # 폐루프라 속도·배터리·노면에 안 흔들린다.
  #
  # ⚠ duration이 이 설계의 핵심 파라미터다. 팻말은 **커브 접근로**에서 읽히지만 앵커는
  # **직선 분기**에서만 발동한다(lane.yaml 커브 게이트가 보류시킴). 즉 이 창은
  # "커브에서 읽은 시점 → 직선 분기 통과 완료"를 **전부 덮어야** 한다.
  # 07-15 낮 2.0s 실패의 진짜 원인이 이거였다: 커브에서 타이머가 시작돼 직선 분기에
  # 닿기 전에 만료 → 앵커가 발동할 기회 자체가 없었다("영영 발동 못 해 정면충돌").
  # 분기를 놓치면 ↑, 분기를 지나고도 한쪽 선만 붙들고 있으면 ↓.
  sign_branch_duration: 5.0         # SIGN_BRANCH 지속 고정시간[s]. 커브 판독 → 직선 분기 통과를 덮을 것.
  # [07-16] 0.5(체감 안 됨) → 0.3 → 0.2(너무 느림) → 0.25 → 0.3 → 0.5 → **0.35**.
  # ⚠ **속도와 조향각은 서로 싸운다** — 이 값을 정하는 진짜 기준이다.
  #   횡변위 ∝ 조향각 × 시간. offset 방식은 '목표'만 주고 차가 시간을 들여 수렴하므로,
  #   빠를수록 **덜 꺾인 채로 분기를 지나간다**. 0.5로 올렸더니 실차서 "맞는 방향으로
  #   꺾긴 하는데 너무 소심하다"가 나왔다 = 속도 인상의 대가였다.
  #   → 0.35로 시간을 되사서 같은 게인으로 더 꺾는다. **직선 주행엔 영향 0**이라
  #   전역 게인(k_cross)을 올리는 것보다 싸다(그건 직선 꿀렁임을 대가로 낸다).
  #   더 세게 꺾고 싶은데 속도는 지키고 싶다면 답은 게인이 아니라 **구간별 게인**이다
  #   (DriveCommand에 steer_gain_scale 추가 = [iface]). 지금 구조엔 그 수단이 없다.
  # 데드밴드 계산(THROTTLE_FWD_START_US=1575, pulse = 1575 + p×425, drive_throttle=0.2 기준):
  #   scale 0.5 → p=0.10 → 1618µs(문턱 위 42µs)  ← 감속 체감 안 됨 + 조향 소심
  #   scale 0.35→ p=0.07 → 1605µs(문턱 위 30µs)  ← 현재
  #   scale 0.3 → p=0.06 → 1600µs(문턱 위 25µs)  ← 분기가 성공한 주행의 그 값
  #   scale 0.25→ p=0.05 → 1596µs(문턱 위 21µs)
  #   scale 0.2 → p=0.04 → 1592µs(문턱 위 17µs)  ← 너무 느렸음. 여기가 **개루프 최저**
  # ⚠ 이 구간은 **문턱 바로 위**라 pulse 몇 µs가 속도를 크게 바꾼다(비선형·매우 가파름).
  #   0.25→0.3은 pulse로 4µs지만 문턱 대비 여유로는 21→25µs = **+19%**다. 조정은 이 폭으로.
  #   (0.3→0.5는 그 기준으로 보면 여유 25→42µs = **+68%**의 큰 점프다.)
  # p=0.04(=0.2)는 캘리브된 순항값 그 자체이고(docs/calibration.md 3절, 배터리 61.4% 실측)
  # 07-16 실차에서도 "0.04까지 내려가도 굴러간다"고 확인됐다 = 개루프 최저. 그 아래
  # (1592µs 미만)는 데드밴드에 먹혀 아예 안 나간다 — 더 느리게 하려면 duty/기어비 쪽이고
  # 별도 설계 합의가 필요하다.
  # ⚠ 여유가 21µs뿐이라 **배터리에 극도로 민감하다**(전압 오르면 문턱이 내려가 체감 속도가
  #   30%씩 튄다). 60±5% 규칙을 벗어나면 여기서 차가 설 수 있다.
  sign_branch_speed_scale: 0.35     # 팻말 분기 중 속도 상한 배율(감속).
  # [07-16] 팻말이 시야에서 사라지고 이만큼 지나면 SIGN_BRANCH 종료(= offset 해제).
  # 실차: 오른쪽으로 분기는 했는데 그 뒤 차선을 못 따라가고 이탈했다. 원인은 offset을
  # 팻말을 지난 뒤에도 5초 내내 물고 있던 것 — 차선폭 36.6cm(중심→선 18.3cm)에서 9cm를
  # 치우쳐 달리면 바깥 바퀴~흰선 여유가 1.8cm뿐이다. offset은 '도로 한가운데 팻말'을
  # 비켜 지나는 용도이므로 지나면 풀려야 한다. 고정 타이머로는 못 푼다(통과 시점은
  # 속도에 달렸고 그 속도는 배터리에 민감) → 팻말이 사라진 것을 신호로 쓴다.
  # 지나기 전에 풀려 팻말을 들이받으면 ↑(1.5), 지나고도 치우쳐 달리면 ↓(0.7). 0=끔.
  sign_lost_release_sec: 1.0        # 팻말 무관측 이만큼 지속 시 분기 종료[s].
  # [07-16] 분기 종료 후 속도 복귀 램프[s]. 0=끔(계단식 복귀, 옛 동작).
  # 실차: "팻말 지나면 속도가 갑자기 확 뛰어서 다시 합쳐지는 구간에서 제어가 불안정".
  # 종료 순간 speed_scale이 분기값 → 평시값으로 **한 프레임에** 점프한다. 스로틀은
  # 데드밴드 문턱 바로 위의 가파른 구간이라 그 점프가 체감상 계단이고, 하필 그 지점이
  # 갈래가 다시 합쳐지는 구간이라 횡루프가 못 따라간다. → 선형 복귀로 바꾼다.
  # (min()으로 얹으므로 decision의 drive_speed_scale 상한을 넘지 않는다.)
  # 합류가 끝나도록 넉넉히. 여전히 급하면 ↑, 코스 시간이 아까우면 ↓.
  sign_exit_ramp_sec: 1.5           # 분기 종료 후 속도 복귀에 걸리는 시간[s]. 0=끔.
  # --- 동적 장애물(아루코) — 07-15 ---
  # 아루코가 사라졌을 때 '진짜 재출발'과 '오검출이었음'을 가르는 최소 체류시간[s].
  # 미달 시 FINISH_WATCH(=편도, 팻말 분기 영영 스킵 + 첫 빨간불에 종료)로 가지 않고
  # LANE_FOLLOW로 되돌린다. 인지의 aruco_hold_sec(1.0)가 present를 늘려주므로 실효
  # 요구치는 2.0-1.0=1.0s = 심판이 마커를 실제로 들고 있어야 하는 시간.
  # 심판이 더 짧게 보여줘서 진짜 정지가 되돌려지면 ↓, 오검출이 계속 통과하면 ↑.
  obstacle_min_dwell_sec: 2.0
  # --- 빨간불 정지 해제(FINISH_STOP → FINISH_WATCH) — 07-15c ---
  # FINISH_STOP이 편도(전이 없음)라 빨강 오검출 하나에 코스가 복구 불가로 끝났다.
  # 대회 중엔 동글을 빼서 페이즈를 손으로 되돌릴 수도 없어 그대로 미션 실패.
  # → 빨강을 마지막으로 본 지 이 시간이 지나면 FINISH_WATCH로 복귀해 주행을 재개한다.
  # 이 값 = **최소 정지시간**이기도 하다(진입 = 방금 빨강을 봤다 = 타이머 0에서 시작).
  # 정지 후 재출발엔 패널티가 없고, 이 시간만큼 서 있으면 '정지했음'이 증명된다.
  #   진짜 빨강(심판이 계속 들고 있음) → 타이머가 계속 0 → 영구 정지(정상 종료).
  #   오검출 → 10초 뒤 스스로 풀림 → 미션 계속 → 진짜 빨간불에서 다시 정지.
  #   오버슛(정지했는데 빨강이 화면 밖) → 10초 뒤 복귀. 증명은 이미 끝나 손해 없음.
  # 증명이 부족하다고 하면 ↑, 오검출 정지가 미션 시간을 너무 깎으면 ↓.
  # ⚠ 0=끔(영구 정지, 옛 동작) — 오검출 복구가 사라지므로 대회 주행은 반드시 >0.
  finish_stop_release_sec: 10.0
