# @file mission.yaml
# @brief 상위 미션 시퀀스(MissionSequencer) 파라미터.
#
# 흐름: 초록불 대기 → 차선 주행 → 장애물 구역(아루코 정지) → 도착 정지.
# 로터리 회전은 이 FSM이 아니라 제어단 StoplineManeuver(개루프 고정조향)가 정지선
# 카운트로 처리한다 → 로터리 튜닝값은 controller.yaml 의 stopline_maneuver 참조.
# 시퀀스: docs/mission_fsm.md

mission:
  # --- 구간별 배율 ---
  slow_speed_scale: 0.5             # 장애물 구역 등 감속 구간 속도 상한 배율.
