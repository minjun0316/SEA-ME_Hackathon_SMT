# @file decision.yaml
# @brief 판단(Decision State Machine) 임계값/배율 파라미터.
#
# 판단은 제어기 튜닝값(controller.yaml)을 건드리지 않고 상태별 "배율/게이트"만
# 정한다(계약 docs/interfaces.md §4.4). 시간 임계값은 초[s] 단위.

decision:
  # --- 유효 검출 판정 ---
  min_points: 2            # lane_path 최소 점 개수(미만이면 미검출 취급).
  # [07-14] 0.35→0.20: confidence = '차선을 잡은 슬라이딩윈도우 수 / 9'라, 커브(특히 S자)에서
  # 한쪽 차선만 보이면 3/9=0.33까지 정상적으로 떨어진다 → 0.35 임계에 걸려 LOST→정지했다.
  # (컨트롤러 단독일 땐 conf를 안 봐서 문제가 없었고, decision을 켜며 드러난 것.)
  # 0.20이면 2/9=0.22까지 허용해 커브를 통과한다. 진짜 소실(conf=0 → lane_detected=false)은
  # 이 값과 무관하게 여전히 LOST로 잡히므로 fail-safe는 유지된다. 커브서 또 서면 ↓.
  conf_min: 0.20           # 이 신뢰도 미만이면 미검출 취급(→ grace 후 LOST).
  conf_drive: 0.60         # 이 이상이면 정상 DRIVE. 미만이면 SLOW.

  # --- 소실/복귀 타이머 ---
  lost_grace: 0.30         # 미검출이 이 시간 이상 지속되면 LOST [s].
  recover_grace: 0.10      # INIT/LOST 탈출에 필요한 연속 유효검출 시간 [s].

  # --- 감속(SLOW) 유발 조건 ---
  heading_slow: 0.35       # |heading_error| 이상이면 SLOW [rad] (~20deg).
  offset_slow: 0.12        # |lateral_offset| 이상이면 SLOW [m].

  # --- 정지선 ---
  stop_trigger_dist: 0.25  # 정지선이 이 거리 이내면 STOP [m].
  stop_approach_dist: 0.60 # 정지선이 이 거리 이내면 접근 감속 SLOW [m].
  stop_dwell: 2.0          # STOP 유지 시간 [s]. 이후 정지선 유지돼도 재출발.
  stopline_heading_gate: 0.40  # 커브 게이트[rad]: |heading_error|가 이 값 이상이면(=커브 중) 정지선 무시. 커브서 가로로 눕는 차선 오인 차단(검출단 폭 하한과 겹치는 안전망). heading_slow(0.35)보다 약간 크게 0.40(~23°). 직진 접근 정지선은 heading 작아 통과. 0=게이트 없음.

  # --- 상태별 출력 배율 ---
  # [07-15] 직선(DRIVE)에서 개루프 상수 스로틀이 터미널 속도까지 계속 가속 →
  # 커브 진입 시 횡루프가 못 따라감(제어 상실). 그래서 DRIVE도 1.0에서 내린다.
  # [07-16b] 실주행값 drive_throttle=0.07 기준 실효: DRIVE 0.063(=1602µs, 문턱 위 27µs)
  # / SLOW 0.056(=1599µs, 문턱 위 24µs). (옛 주석은 0.05 기준이라 µs가 틀렸었다.)
  # ⚠ slow_speed_scale < drive_speed_scale 유지 필수 — 역전되면 커브서 가속하고
  #   직선서 감속한다. (옛 slow=0.9는 drive=1.0 시절 값이라 그대로 두면 역전.)
  drive_speed_scale: 0.9   # DRIVE 속도 배율.
  slow_speed_scale: 0.8    # SLOW 속도 배율. (구 0.9: 저속주행 시 SLOW 반토막이
                           #  모터 breakaway 0.16 아래로 떨어지는 문제 회피용이었으나,
                           #  07-15 재캘리브(FWD_START_US 1650→1575, drive_throttle
                           #  0.16→0.04)로 전제가 사라짐. 0.8×0.05=1592µs > 문턱 1575µs.)
  slow_lookahead_scale: 0.8 # SLOW lookahead 배율(코너서 가까이).
