# mission_cues_node 파라미터 (core.perception.aruco_detect.ArucoConfig 미러)
# 현재 ArUco만 구현. 대회 마커 확정 후 dictionary/target_ids 재확인.
mission_cues_node:
  ros__parameters:
    image_topic: camera/image/compressed
    mission_cues_topic: /perception/mission_cues
    base_frame: base_link
    publish_debug: true
    debug_jpeg_quality: 80

    # --- ArUco (막대에 든 마커를 멀리서 보여줌 → 정지, 사라지면 재출발) ---
    aruco_dictionary: DICT_6X6_50   # 대회 마커 확정: 6x6, ID 3 (2026-07-08)
    aruco_target_ids: [3]           # ID 3만 정지 트리거로 인정. []/음수면 아무 마커나
    aruco_roi_bottom_frac: 1.0      # 화면 전체(막대로 멀리서 보여주므로 하단 ROI 아님)
    aruco_min_perimeter_px: 0.0     # 이 둘레(px) 미만 마커 무시. 0=끔. 원거리 오검 나면 ↑
    # [07-15c] 0.4 → 1.0. 비스듬한/가장자리 마커는 **간헐적으로** 잡히는데, 0.4초만
    # 끊겨도 present가 꺼지고 판단이 곧장 재출발(OBSTACLE_ZONE→FINISH_WATCH)해 버렸다
    # = 실차 증상 "잘 안 멈춤"의 주범(검출률이 아니라 홀드가 짧아서다). 아루코는 심판이
    # 수 초간 들고 있는 신호라 재출발이 1초 늦어도 손해가 없고, 조기 재출발은 충돌이다.
    # 놓친 프레임을 이어 붙여 '몇 초 안에 한 번만 잡으면 정지가 굳는다'로 만든다.
    # ⚠ 판단의 obstacle_min_dwell_sec(2.0)와 짝: 실효 요구치 = 2.0-1.0 = 1.0s.
    #   이 값을 올리면 그쪽도 같이 올려야 오검출 방어가 유지된다.
    aruco_hold_sec: 1.0             # 마커 잠깐 놓쳐도 이 시간 present 유지(흔들림→튐 방지)

    # --- 검출기 파라미터(cv2.aruco.DetectorParameters) — 07-15c ---
    # 아래는 전부 **OpenCV 스톡값 = 건드리기 전과 동일 동작**이다. 튜닝 가능하도록
    # 노출만 해둔 것이지 지금 켜진 튜닝은 없다.
    #
    # ⚠ "비스듬/가장자리 recall 프리셋"을 만들어 봤다가 **되돌렸다**(07-15). 합성 A/B에서
    #   이득이 0이었기 때문이다(스톡 20/36 → 프리셋 20/36). 개별 파라미터도 전부 0~+1로
    #   노이즈 수준. 유일하게 반응한 건 win_step 10→4 였는데 CPU가 3.9→6.4ms/frame(+64%).
    #   ※ 단 그 A/B는 **합성 마커**라 실제 실패 모드를 못 담았을 수 있다. 이 값들을
    #     건드리려면 반드시 **실촬 영상으로 A/B**할 것 — 이론으로 정하지 말 것.
    #
    # 튜닝 전에 로그부터: `raw_det=`(ID/크기 필터 **전** 검출 수)가
    #   0        → 검출기가 마커를 아예 못 봄       = 이 아래 값들 문제
    #   >0인데 present=False → 필터가 버림          = target_ids/min_perimeter_px 문제
    # 대응이 다르니 먼저 구분할 것.
    aruco_error_correction_rate: 0.6       # 스톡 0.6. 비트오류 정정 허용. ↑=비스듬 recall↑ / 오검↑
    aruco_persp_ignored_margin: 0.13       # 스톡 0.13. 셀 샘플링 가장자리 여백. 기울면 ↑(0.20)
    aruco_persp_pixel_per_cell: 4          # 스톡 4. 셀당 샘플수. ↑=비트판독 안정(CPU↑)
    aruco_polygonal_approx_rate: 0.03      # 스톡 0.03. 사각형 근사 허용오차. 렌즈왜곡(가장자리)엔 ↑(0.05)
    aruco_min_corner_dist_rate: 0.05       # 스톡 0.05. 코너 최소거리비. 극단각도엔 ↓(0.02)
    aruco_min_marker_perimeter_rate: 0.03  # 스톡 0.03. 최소 둘레비. 멀면 ↓(0.01)
    # win_step ↓ = 시도 창 수↑ = recall↑ 이지만 CPU가 가장 비싸다(10→4: +64%).
    # mission_cues_node는 core2,3에서 YOLO와 같이 돌고, 하필 아루코가 보이는 순간
    # _yolo_relatch가 YOLO를 켠다(mission.py) = 가장 바쁜 순간이다. 신중히.
    aruco_adaptive_thresh_win_min: 3       # 스톡 3
    aruco_adaptive_thresh_win_max: 23      # 스톡 23
    aruco_adaptive_thresh_win_step: 10     # 스톡 10 (3~23 step10 = 창 3개)

    # --- YOLO 통합 미션신호(신호등 초록/빨강 + 방향팻말 좌/우). 클래스: 0 green/1 left/2 red/3 right ---
    # [07-14] 계획 개편: 신호등·팻말을 한 모델(best.pt)로 통합 → 프레임당 1회 추론.
    #   green/red → traffic_light, left/right → sign_direction 으로 라우팅(노드).
    # 판단 WAIT_START_SIGNAL이 traffic_light=GREEN을 보면 출발. 오출발 방지로 초록을
    # tl_green_confirm_sec 동안 연속 확정해야 GREEN 발행. 실패해도 aruco는 계속 동작.
    yolo_enable: true               # false면 신호등/팻말 stub(aruco만). CPU 아끼려면 false.
    yolo_model_path: best_ncnn_model # [07-14] 통합 모델 NCNN(green/left/red/right, imgsz320 export). pt@640 1.35fps→ncnn@320 9.6fps(코어2,3). 재학습 시 yolo export format=ncnn imgsz=320 후 갱신.
    yolo_conf: 0.35                 # 박스 인정 최소 신뢰도. 오검 나면 ↑, 놓치면 ↓
    yolo_imgsz: 320                 # [07-14] 640→320: 속도 우선(코어핀닝+FPS26). ⚠먼 신호등/팻말 인식 약해질 수 있음(640=학습해상도). 못잡으면 480/640로.
    yolo_max_infer_hz: 6.0          # 추론 상한 fps(카메라 26fps 다 안 돌림→CPU 경합↓)
    yolo_cv_threads: 1              # OpenCV 스레드 상한
    yolo_torch_threads: 2           # torch 스레드 상한
    yolo_stale_sec: 1.0             # 이 시간 내 추론 없으면 신호 NONE으로 폴백
    # [07-15] true→false: 이 설정은 '빨강=출발 금지'였을 때만 안전측이었다. 지금은
    # **빨강=코스 종료**라, 출발선에서 초록과 함께 빨강 박스가 하나라도 뜨면 무조건 빨강이
    # 이겨 출발하자마자 종료돼 버렸다(실차 증상). false면 conf 높은 쪽이 이긴다
    # → 출발선(초록 0.8+ vs 약한 빨강)은 초록 승, 종료선(빨강만)은 빨강 승. 둘 다 정상.
    tl_prefer_red: false            # 초록·빨강 동시 검출 시: false=conf 높은 쪽, true=무조건 RED
    tl_green_confirm_sec: 0.1       # [실험 07-13] 로직 검증용 0.5→0.1(짧은 초록에도 즉시 GREEN→상태전환). 검증 끝나면 0.5로 복귀. 오출발 잦으면 ↑, 출발 굼뜨면 ↓
    # [07-15] 빨강 연속 확정 시간(초록과 대칭). 빨강은 확정 없이 즉시 발행돼 오검출 한 번이
    # 코스를 끝냈다. 판단측 'N연속' 카운트로는 못 막힌다(추론 1번이 카메라 속도로 수십 번
    # 재발행돼 스스로 N연속을 채움) → 시간 기반 확정이 유일한 방법. 오종료면 ↑(0.8), 종료 늦으면 ↓.
    # [07-15b] 0.5→0.2: 종료 반응 우선. YOLO 6Hz라 0.2s ≈ 연속 2회 추론 — 얇아진 시간
    # 방어는 아래 red_min_conf(빨강 전용 신뢰도 게이트)로 보상한다.
    tl_red_confirm_sec: 0.2
    # [07-15b] 빨강 깜빡임 허용 간격 — **이제 실제로 동작한다**(그전엔 선언만 되고 미사용:
    # 코드가 비-빨강 프레임마다 무조건 확정 타이머를 리셋해 주석이 설명하는 방어가 없었다).
    # 모델이 같은 하우징의 빨강↔초록을 깜빡여 한 프레임 초록이 conf로 이겨도, 이 시간 안에
    # 빨강이 다시 보이면 같은 빨강 구간으로 이어 붙여 확정을 유지한다. 놓치면 ↑(0.8), 오종료면 ↓(0.2).
    # ⚠ 이 값이 클수록 '드문드문 뜨는 빨강 오검출'도 한 구간으로 뭉쳐 확정에 도달하기 쉬워진다.
    tl_red_gap_sec: 0.5
    # --- 빨강 전용 게이트 [07-15b] (초록엔 미적용) ---
    # ⚠ 초록에 걸면 안 된다: 출발 신호등은 멀리서 봐야 해서 게이트를 걸면 출발을 못 한다.
    # 빨강만 엄격히 하는 이유: 빨강 오검출 = 코스 조기종료(복구 불가)라 비용이 비대칭이다.
    # 그전까진 둘 다 0(꺼짐)이라 conf 0.35만 넘으면 아무리 멀고 약한 빨강도 종료를 시켰다.
    red_min_conf: 0.6               # 빨강 전용 최소 신뢰도(0=끔→전역 yolo_conf 0.35 사용).
                                    # 종료가 안 되면 ↓(0.5), 오종료면 ↑(0.7). 실측은 로그의 r= 값.
    red_min_box_h_frac: 0.0         # 빨강 박스높이/프레임높이 하한(=거리 게이트). 0=끔.
                                    # 먼 오검출이 남으면 켠다. 실측은 로그의 red_h= 값 보고 잡을 것.
    checker_hold_sec: 0.3           # (폐기) 체커보드 필드용 잔존값. 통합 모델에 checker 클래스 없음→항상 false.
    # 통합 모델 클래스 id(모델 바뀌면 여기만 갱신). 현 best.pt: 0 green/1 left/2 red/3 right.
    # [07-15] 스왑(1↔3) 시도했다가 원복 — 좌/우 반대는 클래스 순서 문제가 아니었다.
    tl_class_green: 0               # 초록불 클래스 id
    tl_class_red: 2                 # 빨간불 클래스 id
    tl_class_left: 1                # 좌지시 팻말 클래스 id
    tl_class_right: 3               # 우지시 팻말 클래스 id

    # --- 팻말 거리·각도 게이트 [07-14] (신호등엔 미적용) ---
    # 문제: 팻말을 너무 멀리서/비스듬히 잡아 아직 그 차선이 안 보이는 구간에서 차선전환을
    # 지시 → 인지가 없는 차선을 좇다 미검출 → 판단 LOST → 정지. "가까이서 정면일 때만" 인정.
    # 튜닝법: 로그의 `sign_h=0.xxx asp=x.xx`가 실측치. 실제로 반응시키고 싶은 거리에서
    # 팻말을 놓고 그때의 sign_h 값을 보고, 그보다 살짝 아래로 임계를 잡는다.
    # [07-15] 팻말은 '도로 정중앙에 선 장애물'이고 좌/우 지시는 랜덤 → 피하려면 **미리**
    # 봐야 한다. 0.40(=화면 40% 채움)은 이미 코앞이라 조향할 시간이 없어 들이받는다.
    #   0.40으로 올렸던 이유는 'S자에서 팻말이 개입해 추종이 깨지는 것' 때문이었는데,
    #   그 방어는 이제 lane.yaml의 sign_force_max_curve_px(커브 게이트)가 거리와 무관하게
    #   담당한다 → 거리 게이트는 '먼 오검출 컷' 수준으로 낮춰 회피 시간을 확보한다.
    #   역할 분리: 커브 게이트=S자 보호(직교 축) / 거리 게이트=오검출 컷.
    # 실측 참고: 팻말 바로 앞 sign_h=0.684 asp=0.90.
    # [07-15 실차] 0.20도 늦어서 팻말에 들이받음 → 0.12로 낮춰 '멀리서 미리' 인식한다.
    #   제어기(lateral_pd)는 부드러운 차선유지용이라 9cm 오프셋 스텝에 조향 0.042밖에
    #   안 나온다 = 급전환 불가. 게인을 키우면 평상시 주행이 흔들리므로, 대신 일찍 인식해
    #   **수렴할 거리**를 벌어준다. S자 오염은 lane.yaml의 직선-연속 카운터가 막으므로
    #   거리 게이트는 이렇게 낮춰도 안전하다.
    # [07-15] 0.12 → 0.30. 기동 방식이 '보이자마자'에서 '**사라지는 순간의 마지막 판독**'
    #   으로 바뀌면서 이 값의 의미가 반대가 됐다: 이젠 **일찍 볼 이유가 없다**.
    #   오히려 높일수록 ①가까이서만 인정 → 박스가 커서 좌/우 판독이 정확하고
    #   ②더 일찍 '사라짐'이 와서 기동이 빨라진다(먼 판독을 아예 안 섞음).
    #   실측: 팻말 앞 sign_h≈0.6~0.9. 0.30이면 그 구간만 인정.
    #   기동이 늦으면 ↑(0.4), 팻말을 아예 못 잡으면 ↓(0.2).
    sign_min_box_h_frac: 0.30       # 팻말 박스높이/프레임높이 하한(거리). 0=끔
    sign_min_box_aspect: 0.0        # 팻말 박스 w/h 하한(각도). 비스듬할수록 납작(작아짐). 분기 실측 asp=0.90(정면) → 비스듬한 게 계속 걸리면 0.6으로. 0=끔(기본)

    # --- 방향 팻말(좌/우) 인지: OpenCV 색 트리거 + 방향(통합 YOLO) — 07-14 ---
    # 색 트리거(sign_color_*)는 매 프레임(경량) '팻말 구간 진입(sign_detected)'만 판정.
    # 방향(좌/우)은 이제 위 통합 모델(best.pt: tl_class_left/right)이 담당 — 별도 팻말
    # 모델 안 씀(sign_model_path 비움). 방향 YOLO 소비는 판단이 sign_enable(SIGN_BRANCH) 켤 때만.
    # ⚠ sign_color_lo/hi 는 '파란 팻말' 잠정 기본값 — 대회 팻말 실측색으로 반드시 교체(HSV).
    sign_color_lo: [100, 120, 60]   # HSV 하한(팻말색). H0~179 S/L0~255.
    sign_color_hi: [130, 255, 255]  # HSV 상한.
    sign_min_px: 400                # 색 픽셀 이 이상이면 팻말 구간 진입 트리거(stray 배제)
    sign_roi_top_frac: 0.0          # 색 탐색 상단 잘라내기 비율(0=전체)
    sign_model_path: ''             # (미사용) 방향은 통합 모델이 담당. 색 트리거만 남김. 별도 팻말 모델 쓸 때만 지정.
    sign_conf: 0.35                 # (미사용) 별도 팻말 모델용. 통합 방향은 yolo_conf 사용.
    sign_imgsz: 320                 # (미사용) 별도 팻말 모델용. 통합 방향은 yolo_imgsz 사용.
    sign_class_left: 0              # 좌지시 팻말 클래스 id(모델 확정 시 갱신)
    sign_class_right: 1             # 우지시 팻말 클래스 id(모델 확정 시 갱신)
    sign_stale_sec: 0.5             # 이 시간 내 방향추론 없으면 SIGN_NONE 폴백
