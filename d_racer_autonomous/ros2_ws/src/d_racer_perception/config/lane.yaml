# lane_detect_node 캘리브/임계값 (core.perception.lane_detect.LaneCalib 미러)
# 픽셀→미터 스케일은 캘리브 전 잠정값 — 트랙에서 실측·튜닝할 것.
lane_detect_node:
  ros__parameters:
    image_topic: camera/image/compressed
    lane_status_topic: /perception/lane_status
    lane_path_topic: /perception/lane_path
    base_frame: base_link
    publish_debug: false   # 07-10 true→false: 주행중 디버그 JPEG 3장/프레임(debug+bev+edges) 인코딩이 lane_detect rate를 갉아 lookahead 타깃 갱신 지연→과조향. 성능주행엔 off. 인지 시각화 필요할 때만 true.
    debug_jpeg_quality: 80

    # --- BEV: 4점 원근변환 행렬(이미지→BEV, 행우선 9값) ---
    # 07-09: 체커보드 IPM은 카메라가 먼데 향해(신호등) 근거리 가로시야 좁아 하단 좌우가 잘림(윗변 긴 사다리꼴).
    # → 사용자 요청으로 4점 방식 복귀: src 상단(0.2/0.4)·하단 full-width 사다리꼴을 BEV 사각형 전체로 늘림(잘림 0%).
    #   bev_matrix = getPerspectiveTransform(src,dst), src=[[.2w,.4h],[.8w,.4h],[w,h],[0,h]] dst=전체. bev_top_x/y와 정합(아래).
    #   노드가 bev_matrix를 강제(폴백 비활성)라 4점 행렬을 직접 넣음. ⚠️4점은 비metric(늘림 비균일)→아래 m_per_px는 원본IPM 최적근사.
    # 07-10: straight11 원본서 두 흰차선 선형피팅→그 사다리꼴 src를 직사각형 dst로 매핑(차선이 BEV서 수직·평행 일자).
    #   src=[[131,55],[207,55],[275,158],[68,158]](320x160), dst 차선=x90/x230(간격140px=35cm→lateral 0.0025 보존).
    #   실측 검증: bev_new.jpg서 두 차선이 x=90,230 수직선과 일치. bottom 코너 소량 검정(무시 가능).
    bev_matrix: [23.551359, 33.763415, -3795.973942, 0.0, 54.104909, -2975.76999, 0.0, 0.214114, 1.0]

    # --- 픽셀→미터(BEV 기준). 4점 BEV의 비균일 스케일을 원본IPM 미터로 최적근사(선형회귀) ---
    m_per_px_forward: 0.005721  # 4점: 상단 늘림으로 전방 1px가 더 먼거리. 원본IPM 기준 회귀(전방 잔차 3.9cm RMS).
    m_per_px_lateral: 0.002506  # 4점 횡 스케일 회귀(횡 잔차 3.7cm RMS). 차선폭 35cm≈140px.
    x_near_m: 0.0539            # 4점 하단행이 매핑되는 전방거리[m](회귀). IPM땐 0.15였음.

    # --- 4점 BEV src 비율 (위 bev_matrix가 이 값들로 만든 4점 행렬과 정합). 상단 y=0.4h, 좌우 x=0.2w~0.8w, 하단 full-width ---
    bev_top_y: 0.4
    bev_top_x: 0.2

    # --- 색/정지선 임계 ---
    # 노랑/흰 HLS 임계(H,L,S). 2026-07-14 인지팀 실측값(calibrate_hls)으로 교체.
    # OpenCV BGR2HLS 규약: H 0~179, L/S 0~255. H 범위가 넓어 L·S가 주 판별축.
    # 재측정 시 calibrate_hls 트랙바로 값 다시 잡아 여기(+core LaneCalib 기본값) 갱신.
    # 노랑 HLS 임계 — 차선추종에선 폐기(흰선-only, 07-14). 정지선(stopline_color=yellow) 전용.
    yellow_lo: [0, 146, 129]
    yellow_hi: [153, 225, 255]
    # 흰색 고정 임계(white_adaptive=False 경로가 사용). 노드가 파라미터로 물려 여기서 튜닝.
    white_lo: [0, 213, 0]
    white_hi: [172, 255, 255]
    white_pixel_threshold: 200    # 흰 픽셀 이 이상이면 white_detected=True(진단용 하한)

    # --- 에지(Canny) 입력/임계 (흰선 끊김 개선, 07-10) ---
    # 정리한 lane_mask에 직접 Canny → 윤곽 연속·깨끗(gray/blur 대비 '인식했다 말았다' 완화).
    edge_from_mask: true    # false면 옛 경로(마스킹 BGR→gray→blur→Canny)
    edge_close_ksize: 3     # MORPH_CLOSE/dilate 커널(작은 구멍 메움)
    edge_dilate_iter: 1     # dilate 반복(차선 두껍게→창별 minpix 안정). 0=off
    canny_lo: 30            # 옛 50→30(흰선 민감도↑). 노이즈 많으면 ↑
    canny_hi: 90            # 옛 150→90. lo의 ~3배 유지
    # 정지선(행별 흰색 커버리지 밴드 — Hough 대체, 조명/점선 강건). 적응형 흰 마스크 재사용.
    stopline_color: yellow        # 정지선 색: yellow|white|both. 실트랙 정지선=노랑(07-12: 흰색으로 찾다 못 잡던 버그 수정). 차선도 노랑이나 세로라 행커버리지 낮아 구분됨.
    stopline_roi_h: 0             # 0=ROI 없이 BEV '전체'에서 정지선 탐색(07-14). >0 이면 하단 그 px만(옛 110=하단만). 되돌리려면 110. 전체탐색은 원거리/커브 오검↑ — 폭상한(max_width_m)·min_rows·decision heading 게이트가 방어선.
    stopline_row_coverage: 0.45   # 한 행이 폭의 이 비율 이상 흰색이면 정지선 후보 행(하한). 오검출이면 ↑, 안잡히면 ↓.
    stopline_max_width_m: 0.40    # 가로폭 상한[m]: 한 행 연속 정지선색 폭이 이 값 초과면 '가로로 너무 긺'→후보 제외. 실측 정지선폭=0.35(≈140px). 0.35+여유(왜곡/양자화)로 0.40 권장. 벽·프레임 가로지르는 얼룩은 훨씬 길어 확실히 잘림. 진짜 정지선이 잘리면 ↑, 오검출 남으면 0.35로 ↓, 0=상한없음.
    # 행수 방식(07-14): 커버리지 임계(stopline_row_coverage) 넘은 후보 행 수가 min_rows 이상이면 정지선 검출.
    stopline_min_rows: 6            # 후보 행이 이만큼 이상이면 정지선 검출. 안잡히면 ↓, 오검출이면 ↑.
    # --- 정지선 검출 방식(07-14: 작년 검증 Hough 재이식) ---
    # coverage=행 커버리지(위 stopline_row_coverage/min_rows/max_width_m 사용).
    # hough=작년에 실제로 잘 잡던 방식: 정지선색 마스크→Canny→HoughLinesP→'수평' 선분
    # 길이합 > stopline_len_threshold면 검출(세로 차선은 각도로 배제). 색은 stopline_color 그대로.
    stopline_method: hough         # coverage|hough. coverage가 못 잡아 hough로 전환.
    stopline_len_threshold: 150.0  # hough: 수평 선분 길이합 임계(작년값 150). 안잡히면 ↓, 오검출이면 ↑.
    stopline_canny_lo: 100         # hough: 마스크 Canny 하한.
    stopline_canny_hi: 200         # hough: 마스크 Canny 상한.
    stopline_hough_thresh: 40      # hough: HoughLinesP 누적 임계.
    stopline_hough_min_len: 40     # hough: 최소 선분 길이[px].
    stopline_hough_max_gap: 5      # hough: 선분 내 최대 갭[px].
    stopline_angle_tol_deg: 10.0   # hough: 수평 판정 허용각[deg]. 세로 차선 배제.

    # --- 커브: 한쪽 차선 소실 시 복원용 차선폭[BEV px] ---
    # 두 선 다 보이는 프레임에서 자동 학습. 아래는 학습 전 초기값(트랙서 조정 가능).
    lane_width_px: 146.0  # single_anchor 바이어스 = 이 값/2(왼선 anchor: 중심=왼선+W/2). 07-14: 차 정중앙서 offset=0 되도록 실측 튜닝(W=146→offset≈0). 왼선기준: 너무 왼쪽→↑, 너무 오른쪽→↓.
    # 차선폭 자동학습 스위치: true=두 선 보일 때 EMA 재학습(위 값은 초기값), false=끄고
    # lane_width_px 고정값만 사용(학습 표류로 복원폭이 흔들릴 때 잠금). 한쪽 소실 복원·붕괴판정 공통.
    lane_width_learn: false

    # --- 단일 기준선 고정 추종(single_anchor) — 오른선 하나만 추적(붕괴/좌우헷갈림 원천 차단) ---
    # 중심선 = 오른선 − lane_width_px/2. 오른선 소실(점선 갭) 시 anchor_hold_frames 동안
    # 직전 피팅 유지(coast). 지름길 오른선=실선(중간 점선)이라 hold 넉넉히. dual 되돌리려면 false.
    single_anchor: false        # 고정 단일 기준선 모드. 아래 adaptive_anchor와 배타(true면 adaptive 무시).
    anchor_side: left           # single_anchor=true일 때만 의미. 이 트랙: 오른선이 화면 밖으로 나가 왼선 기준.
    anchor_hold_frames: 12      # 단일 모드 소실 시 직전 anchor 유지 프레임(점선 갭 coast). 소실서 반대선 튀면 ↓, 갭서 끊기면 ↑

    # --- 적응형 anchor(3-state): 직선/양선=dual, 커브=바깥선 single 자동 전환 (07-14 신규) ---
    # 기하: 커브에서 안쪽 선이 BEV 옆으로 먼저 빠지고 바깥(커브 반대쪽) 선이 남는다
    # → 오른쪽 커브=왼선 anchor, 왼쪽 커브=오른선 anchor. 직선·양선 뚜렷하면 dual(양선 중앙).
    # 커브에선 안쪽(노이즈·소실) 선을 무시 → dual 붕괴/조기치우침(3번 커브 이탈) 원천 차단.
    adaptive_anchor: true       # false=순수 dual(기존). true=커브방향 따라 dual↔단일 자동.
    curve_dx_deadband_px: 18.0  # |near-x − far-x|[BEV px] 이 값 초과면 '커브' 판정(직선 격리). 커브 전환 늦으면 ↓, 직선서 자꾸 단일로 새면 ↑.
    # 방향 팻말 강제 anchor 시(판단 turn_bias) 그 차선 중앙에서 팻말 방향으로 더 붙일
    # 오프셋[m]. 0=차선 중앙만. >0이면 팻말쪽으로 치우쳐 '그쪽으로 가는' 느낌. 실차서 올려가며 튜닝.
    lane_mode_topic: /decision/lane_mode
    # [07-15] 팻말이 '도로 정중앙'에 서 있고 양쪽으로 통로가 갈리는 구조(장애물 회피).
    # 지시된 쪽 끝차선을 anchor하면 중심 = 그 선 ± W/2 = 도로 한가운데 = 팻말 자리(충돌!).
    # → 팻말 반대쪽(바깥)으로 W/4 만큼 밀어 '그쪽 통로 한가운데'로 보낸다.
    #   도로폭 146px=36.6cm → 통로 하나 18.3cm → 통로 중앙 = 끝선에서 9.1cm = W/4.
    # 부호는 코드가 자동(왼선 anchor면 왼쪽으로, 오른선이면 오른쪽으로 = 항상 팻말 반대).
    # [07-15 실차] 0.09 확정 — 속도를 조금 올려 차선에 제대로 진입시키니 통로 중앙으로
    # 잘 들어갔다(앞서 흰선을 넘던 건 오프셋 과다가 아니라 진입 문제였음).
    # 팻말을 긁으면 ↑(0.11), 바깥 흰선을 넘어가면 ↓(0.07).
    # [07-15] 0.09 → 0.0: 경로 offset 방식 폐기. lateral_pd가 부드러운 차선유지용이라
    # 9cm 스텝에 조향 0.042밖에 안 나와 반응이 늦었다 → **판단의 고정조향 기동**으로 교체
    # (decision_node sign_steer_value=0.2 를 sign_steer_sec=1.0 동안 직접 얹음).
    # 0으로 둬야 이중 적용이 안 된다. 고정조향을 끄고(sign_steer_enable=false) 옛 방식으로
    # 돌아가려면 여기 0.09를 되살릴 것.
    #
    # [07-15 밤] 0.0 → **0.09 복원**. 고정조향을 폐기하고 anchor로 돌아왔으므로 이중 적용
    # 걱정이 없어졌고(판단은 이제 steer_bias를 아예 안 실는다), anchor 모드에선 이 값이
    # **없으면 안 된다**: anchor 중심선 = 왼선 + W/2 − offset (lane_detect.py:528,690).
    # offset=0이면 왼선+W/2 = **도로 정중앙 = 팻말 정면충돌**이다. 팻말은 갈림길이 아니라
    # 도로 한가운데 선 장애물이라(:287) 통로 중앙(W/4=9.1cm)까지 더 밀어야 한다.
    # 위 07-15 낮 실차서 "0.09 확정 — 통로 중앙으로 잘 들어갔다"고 검증된 값 그대로.
    # [07-16] 0.09 → 0.11 시도 후 **0.09 복원**(기하학적 정답).
    # 실측 기하: 차선폭 35cm(흰선 안쪽 실측) → 반차선 17.5cm → **팻말 옆 통로 중앙 = 8.75cm**
    # ≈ 0.09. 차폭 ~14cm(실측) 기준 바깥 끝: 0.09 → 16.0cm(여유 1.5cm) / 0.11 → 18.0cm
    # = **선을 0.5cm 넘는다**. 즉 0.11은 애초에 불가능한 값이었다.
    # ⚠ 이 기동은 원래 여유가 ±1.5cm뿐이다(반차선 17.5cm에 차폭 14cm). 통로 중앙을
    #   벗어나는 순간 팻말이나 흰선 중 하나를 친다 = **offset은 튜닝 여지가 거의 없는 값**이다.
    # ⚠ **이 값을 조향 세기 노브로 쓰지 말 것.** offset은 '조향 명령'이 아니라 '목표 위치'다
    # — 키우면 더 세게 꺾는 게 아니라 **더 바깥에 가서 서는** 것이고, 조향 세기는 게인이 정한다
    # (pC = k_cross × offset, pH는 0 — 평행이동이라 heading 오차가 안 생긴다).
    # 분기가 소심하면 답은 셋: ①분기 속도 ↓(시간을 벌어 수렴시킴, 직선 영향 0 — 07-16 채택)
    # ②구간별 게인(DriveCommand에 steer_gain_scale 추가 = [iface], 직선 영향 0)
    # ③전역 k_cross ↑(직선 꿀렁임이 대가 — k_cross가 0.47로 낮은 이유가 그것).
    sign_lane_offset_m: 0.09
    # [07-15] 팻말 강제의 '커브 게이트': |curve_dx|가 이 값을 넘으면(=커브 중) 팻말 지시를
    # 무시하고 기하학(adaptive) 추종을 유지한다. S자 끝은 팻말과 가까워 거리 게이트
    # (mission_cues.sign_min_box_h_frac)로 안 갈렸다 → '커브냐 직선이냐'라는 다른 축으로 분리.
    # 직선이 되면 그때 팻말이 먹는다. S자서 또 팻말이 개입하면 ↓(12), 분기가 살짝 굽어
    # 팻말이 안 먹으면 ↑(25~30). 0=게이트 끔.
    sign_force_max_curve_px: 18.0
    # [07-15] S자 변곡점 대책: 좌↔우가 바뀌는 순간 curve_dx가 0을 지나 '직선'으로 보여
    # 게이트가 열리고 팻말이 튀어들어왔다 → '직선이 이만큼 연속'돼야 팻말 허용.
    # 변곡점의 찰나 직선은 못 채워 차단되고, 진짜 직선 접근로는 채워서 통과한다.
    # 아래 sign_force_* 는 sign_apply="anchor"일 때만 의미. "offset"에선 미사용.
    sign_force_straight_frames: 6    # ~0.3s @20fps
    # [07-16 실차] 위 두 게이트를 노이즈가 무력화했다. 로그 실측: dx가 50ms 간격으로
    # +45 → -49로 부호가 뒤집힘(= 차가 낼 수 없는 변화 = BEV 원거리 끝점 노이즈).
    # |노이즈| 최대 62 > 임계 18이라 연속 직선 카운터가 계속 0으로 리셋 → 팻말이 딱
    # 한 프레임만 발동하고 무너졌다(오른쪽 팻말인데 왼쪽으로 감). 같은 로그의 **중앙값은
    # +3.5** = 차는 실제로 직선 위에 있었다 → 게이트 판정 전 중앙값 필터로 노이즈만 제거.
    # (임계 ↑는 오답: ±62를 넘기려면 65+ = 게이트를 없애는 것과 같다. 25로만 올려도
    #  dx≈20인 완만한 진짜 커브가 새 나간다 → 임계는 18 그대로, 창만 키운다.)
    # 창 7 = 그 로그 재생 결과(노이즈 std ~30px): 5면 4/22프레임만 발동해 부족했고,
    # 7이면 12/22가 **연속 0.6s** 발동한다(진짜 커브 dx 30~52 연속은 여전히 0/22 차단).
    # 지연 (N-1)/2 = 3프레임 = 0.15s@20fps. 1=필터 끔.
    # 진짜 커브를 놓치면 ↓(5), 노이즈가 여전히 새면 ↑(9~11).
    sign_curve_median_frames: 7      # curve_dx 중앙값 필터 창[프레임]

    # [07-15 실차] 팻말 적용 방식. 실트랙은 팻말로 이어지는 접근로가 '커브'다.
    #   anchor 방식은 커브에서 양립 불가로 보였다: 강제하면 커브 기하학이 깨져 추종 실패,
    #   직선 게이트로 막으면 커브 접근로에선 영영 발동 못 해 팻말에 정면충돌.
    #   → "offset": 기하학이 만든 중심선을 팻말 반대쪽으로 평행이동만 한다.
    #     차선 추종 로직을 안 건드리므로 커브에서도 안전하고, 커브/직선 게이트도 불필요.
    #   (그 offset도 곧 폐기됐다 — lateral_pd가 9cm 스텝에 조향 0.042뿐 = 권한 부족.)
    #
    # [07-15 밤] offset → **anchor 복귀**. 위 "양립 불가"는 오진이었다.
    #   진짜 원인은 anchor가 아니라 **창이 짧았던 것**: mission의 sign_branch_duration이
    #   2.0s라, 커브 접근로에서 팻말색이 잡히는 순간 타이머가 시작돼 **직선 분기에 닿기 전
    #   만료**됐다. 그래서 직선 게이트가 열릴 때쯤엔 turn_bias가 이미 NONE → 발동 기회 자체가
    #   없었다. 게이트가 막은 게 아니라 지시가 먼저 사라진 것이다.
    #   → duration 2.0 → 5.0(config/mission.yaml)으로 창을 넓혀 "커브에서 읽고(판독) →
    #     직선 분기에서 발동" 분리가 비로소 성립한다. 분기 구간 자체는 직선이므로
    #     아래 커브 게이트는 **그대로 두는 게 맞다**(풀면 커브에서 발동해 기하학이 깨진다).
    #   anchor를 쓰는 이유: offset은 dual 중심선을 9cm 미는 '계단'이라 권한이 부족했지만,
    #     anchor는 중심선의 **출처**를 바꾼다 — 갈래가 벌어질수록 오차가 스스로 커져
    #     lateral_pd 게인을 안 올려도 분기를 탄다.
    #
    # [07-16 실차] anchor → **offset 전환**. anchor는 두 번의 실차에서 **한 프레임도
    #   제대로 발동하지 못했다**. 원인은 튜닝이 아니라 설계다: anchor는 "팻말이 가리키는
    #   쪽 선"을 기준선으로 요구하는데, **S자에선 그 선이 바로 그때 없다** —
    #   커브에선 '안쪽' 선이 BEV에서 먼저 빠지므로(adaptive 기하) 우커브=오른선 소실,
    #   좌커브=왼선 소실. 07-16에 기준선을 왼선으로 고정해봤지만 좌커브에서 똑같이
    #   `dropped:left:왼선없음`이 떴다 = 거울상 실패. **어느 한쪽에 고정 앵커하는 설계는
    #   S자에서 원리적으로 성립하지 않는다**(양쪽이 번갈아 사라지므로).
    #   → 팻말 방향과 기준선 선택을 **분리**한다: 기준선은 adaptive가 알아서(보이는 바깥선),
    #   팻말은 그 중심선에 ±offset만 얹는다. 커브/직선·어느 선이 보이든 **항상 발동**하고
    #   커브 게이트도 '지시된 쪽 선 소실'도 존재하지 않는다.
    #   폐기 사유였던 "9cm 스텝은 조향 0.042뿐 = 권한 부족"은 재검토 대상이다: 그 판정이
    #   내려질 때 anchor는 사실 한 번도 발동한 적이 없어(무증상 폴백) 비교 자체가 성립하지
    #   않았다. 권한이 실제로 부족하면 sign_lane_offset_m ↑(0.12~0.15)가 노브.
    #   (아래 sign_force_* 커브 게이트는 offset 모드에선 미사용 — anchor로 되돌릴 때만 의미.)
    sign_apply: offset               # offset(07-16 복귀: 항상 발동) | anchor(S자서 발동 불가)

    # --- 3-state 모드 전환 히스테리시스 / 붕괴판정 / 법선오프셋 (adaptive_anchor가 사용) ---
    lane_collapse_frac: 0.5   # 양선 인정 최소 수평간격 = 이 값×lane_width_px(146px→73px). 이보다 좁으면 붕괴로 보고 dual 승격 안 함.
    both_enter_frames: 3      # 직선+양선 뚜렷 이만큼 연속 → dual(양선중앙) 복귀(~0.15s@20fps). dual 복귀 늦으면 ↓.
    both_exit_frames: 3       # 커브 감지(또는 좌↔우) 이만큼 연속 → 바깥선 단일 전환. 커브 진입 늦으면 ↓, 직선서 자꾸 단일로 새면 ↑.
    perp_offset: true         # 단일 모드서 폭/2 오프셋을 법선(수직)으로. 곡선서 수평오프셋 부족→치우침 방지. false=옛 수평.
    perp_max_slope: 1.5       # 법선 배율 √(1+slope²)의 slope(dx/dy) 절댓값 상한(병적 피팅 오프셋 폭주 방지). 중심이 반대차선 넘으면 ↓.

    # --- lost 재획득 시 base fallback (07-10) ---
    # 히스토그램 peak 열의 에지량이 (스캔행수×255×seed_min_fill) 미만이면 그쪽 차선을
    # '미검출'로 보고 base를 화면 25%/75%에 고정(argmax가 0/노이즈를 base로 잡는 것 방지).
    # ↑ 노이즈를 차선으로 오인하면(엉뚱한 점 지속) 올리고, 흐린 차선을 자꾸 놓치면 내려.
    seed_min_fill: 0.05
    seed_reacquire_blend: 0.7 # lost 재획득: base = prev*(1-b) + hist_peak*b. 0.5=반반.

    # --- lock 중 히스토그램 블렌딩 (07-10, 기본 off) ---
    # lock(추종 중)에도 매 프레임 hist peak를 seed에 섞어 커브 지연↓. 0.0=off(순수 prev).
    # seed = prev*(1-b) + peak*b. 단, prev ±seed_hist_band_px 밴드 안 peak만·에지량
    # 충분할 때만 섞음(반대차선 점프·garbage 배제). 켤 땐 0.1~0.3, seed 떨리면 낮춰.
    seed_lock_hist_blend: 0.95
    seed_hist_band_px: 90.0    # 위 밴드 폭(±px). 좁을수록 안전(점프 억제), 넓을수록 반응↑.
