# lane_detect_node 캘리브/임계값 (core.perception.lane_detect.LaneCalib 미러)
# 픽셀→미터 스케일은 캘리브 전 잠정값 — 트랙에서 실측·튜닝할 것.
lane_detect_node:
  ros__parameters:
    image_topic: camera/image/compressed
    lane_status_topic: /perception/lane_status
    lane_path_topic: /perception/lane_path
    base_frame: base_link
    publish_debug: false   # 07-10 true→false: 주행중 디버그 JPEG 3장/프레임(debug+bev+edges) 인코딩이 lane_detect rate를 갉아 lookahead 타깃 갱신 지연→과조향. 성능주행엔 off. 인지 시각화 필요할 때만 true.
    debug_jpeg_quality: 80

    # --- BEV: 4점 원근변환 행렬(이미지→BEV, 행우선 9값) ---
    # 07-09: 체커보드 IPM은 카메라가 먼데 향해(신호등) 근거리 가로시야 좁아 하단 좌우가 잘림(윗변 긴 사다리꼴).
    # → 사용자 요청으로 4점 방식 복귀: src 상단(0.2/0.4)·하단 full-width 사다리꼴을 BEV 사각형 전체로 늘림(잘림 0%).
    #   bev_matrix = getPerspectiveTransform(src,dst), src=[[.2w,.4h],[.8w,.4h],[w,h],[0,h]] dst=전체. bev_top_x/y와 정합(아래).
    #   노드가 bev_matrix를 강제(폴백 비활성)라 4점 행렬을 직접 넣음. ⚠️4점은 비metric(늘림 비균일)→아래 m_per_px는 원본IPM 최적근사.
    # 07-10: straight11 원본서 두 흰차선 선형피팅→그 사다리꼴 src를 직사각형 dst로 매핑(차선이 BEV서 수직·평행 일자).
    #   src=[[131,55],[207,55],[275,158],[68,158]](320x160), dst 차선=x90/x230(간격140px=35cm→lateral 0.0025 보존).
    #   실측 검증: bev_new.jpg서 두 차선이 x=90,230 수직선과 일치. bottom 코너 소량 검정(무시 가능).
    bev_matrix: [23.551359, 33.763415, -3795.973942, 0.0, 54.104909, -2975.76999, 0.0, 0.214114, 1.0]

    # --- 픽셀→미터(BEV 기준). 4점 BEV의 비균일 스케일을 원본IPM 미터로 최적근사(선형회귀) ---
    m_per_px_forward: 0.005721  # 4점: 상단 늘림으로 전방 1px가 더 먼거리. 원본IPM 기준 회귀(전방 잔차 3.9cm RMS).
    m_per_px_lateral: 0.002506  # 4점 횡 스케일 회귀(횡 잔차 3.7cm RMS). 차선폭 35cm≈140px.
    x_near_m: 0.0539            # 4점 하단행이 매핑되는 전방거리[m](회귀). IPM땐 0.15였음.

    # --- 4점 BEV src 비율 (위 bev_matrix가 이 값들로 만든 4점 행렬과 정합). 상단 y=0.4h, 좌우 x=0.2w~0.8w, 하단 full-width ---
    bev_top_y: 0.4
    bev_top_x: 0.2

    # --- 색/정지선 임계 ---
    # 노랑/흰 HLS 임계(H,L,S). 2026-07-14 인지팀 실측값(calibrate_hls)으로 교체.
    # OpenCV BGR2HLS 규약: H 0~179, L/S 0~255. H 범위가 넓어 L·S가 주 판별축.
    # 재측정 시 calibrate_hls 트랙바로 값 다시 잡아 여기(+core LaneCalib 기본값) 갱신.
    yellow_lo: [0, 146, 129]
    yellow_hi: [153, 225, 255]
    # 흰색 고정 임계(white_adaptive=False 경로가 사용). 노드가 파라미터로 물려 여기서 튜닝.
    white_lo: [0, 213, 0]
    white_hi: [172, 255, 255]
    yellow_pixel_threshold: 200
    # 노랑 '우세'(노랑-only 마스크) 판정: 노랑 > yellow_pixel_threshold AND 노랑 >= 흰색×이 비율.
    # 07-14: 0.01→0.5, 임계 15→250. on_yellow 래치가 지름길 노랑모드를 담당하게 되면서
    # (use_yellow_only = on_yellow OR yellow_dominant), 이 매프레임 판정은 '강한 노랑만'
    # 즉시반응하도록 조임 — 흰 구간서 소량 노랑(얼룩/반사)에 노랑모드로 새던 오작동 방지.
    # 노랑모드 진입이 늦으면 임계↓/ratio↓, 흰 구간서 노랑으로 새면 ↑.
    yellow_over_white_ratio: 0.2

    # --- 노랑 지름길 래치(on_yellow) — 미션 SHORTCUT 진입 신호(hysteresis) ---
    # '노랑 우세'(노랑 픽셀 ≥ min_px AND 노랑 ≥ 흰색×dom_ratio) 프레임이 enter_frames
    # 연속이면 ON, 비우세가 exit_frames 연속이면 OFF. exit>enter 비대칭이 점선 갭을 견딤.
    # 마스크 선택(yellow_over_white_ratio)과 독립. 트랙 튜닝: SHORTCUT 진입이 늦으면
    # enter_frames↓/min_px↓, 흰선 구간에서 오래치되면 dom_ratio↑/min_px↑.
    on_yellow_min_px: 300         # 노랑 절대 픽셀 하한(stray 배제)
    on_yellow_dom_ratio: 1.2      # 노랑 ≥ 흰색×이 배 여야 우세
    on_yellow_enter_frames: 5     # 연속 우세 프레임 → ON(~0.25s@20fps)
    on_yellow_exit_frames: 15     # 연속 비우세 프레임 → OFF(~0.75s, 점선 갭 견딤)

    # --- 에지(Canny) 입력/임계 (흰선 끊김 개선, 07-10) ---
    # 정리한 lane_mask에 직접 Canny → 윤곽 연속·깨끗(gray/blur 대비 '인식했다 말았다' 완화).
    edge_from_mask: true    # false면 옛 경로(마스킹 BGR→gray→blur→Canny)
    edge_close_ksize: 3     # MORPH_CLOSE/dilate 커널(작은 구멍 메움)
    edge_dilate_iter: 1     # dilate 반복(차선 두껍게→창별 minpix 안정). 0=off
    canny_lo: 30            # 옛 50→30(흰선 민감도↑). 노이즈 많으면 ↑
    canny_hi: 90            # 옛 150→90. lo의 ~3배 유지
    # 정지선(행별 흰색 커버리지 밴드 — Hough 대체, 조명/점선 강건). 적응형 흰 마스크 재사용.
    stopline_color: yellow        # 정지선 색: yellow|white|both. 실트랙 정지선=노랑(07-12: 흰색으로 찾다 못 잡던 버그 수정). 차선도 노랑이나 세로라 행커버리지 낮아 구분됨.
    stopline_roi_h: 0             # 0=ROI 없이 BEV '전체'에서 정지선 탐색(07-14). >0 이면 하단 그 px만(옛 110=하단만). 되돌리려면 110. 전체탐색은 원거리/커브 오검↑ — 폭상한(max_width_m)·min_rows·decision heading 게이트가 방어선.
    stopline_row_coverage: 0.45   # 한 행이 폭의 이 비율 이상 흰색이면 정지선 후보 행(하한). 오검출이면 ↑, 안잡히면 ↓.
    stopline_max_width_m: 0.40    # 가로폭 상한[m]: 한 행 연속 정지선색 폭이 이 값 초과면 '가로로 너무 긺'→후보 제외. 실측 정지선폭=0.35(≈140px). 0.35+여유(왜곡/양자화)로 0.40 권장. 벽·프레임 가로지르는 얼룩은 훨씬 길어 확실히 잘림. 진짜 정지선이 잘리면 ↑, 오검출 남으면 0.35로 ↓, 0=상한없음.
    # 행수 방식(07-14): 커버리지 임계(stopline_row_coverage) 넘은 후보 행 수가 min_rows 이상이면 정지선 검출.
    stopline_min_rows: 6            # 후보 행이 이만큼 이상이면 정지선 검출. 안잡히면 ↓, 오검출이면 ↑.
    # --- 정지선 검출 방식(07-14: 작년 검증 Hough 재이식) ---
    # coverage=행 커버리지(위 stopline_row_coverage/min_rows/max_width_m 사용).
    # hough=작년에 실제로 잘 잡던 방식: 정지선색 마스크→Canny→HoughLinesP→'수평' 선분
    # 길이합 > stopline_len_threshold면 검출(세로 차선은 각도로 배제). 색은 stopline_color 그대로.
    stopline_method: hough         # coverage|hough. coverage가 못 잡아 hough로 전환.
    stopline_len_threshold: 150.0  # hough: 수평 선분 길이합 임계(작년값 150). 안잡히면 ↓, 오검출이면 ↑.
    stopline_canny_lo: 100         # hough: 마스크 Canny 하한.
    stopline_canny_hi: 200         # hough: 마스크 Canny 상한.
    stopline_hough_thresh: 40      # hough: HoughLinesP 누적 임계.
    stopline_hough_min_len: 40     # hough: 최소 선분 길이[px].
    stopline_hough_max_gap: 5      # hough: 선분 내 최대 갭[px].
    stopline_angle_tol_deg: 10.0   # hough: 수평 판정 허용각[deg]. 세로 차선 배제.

    # --- 커브: 한쪽 차선 소실 시 복원용 차선폭[BEV px] ---
    # 두 선 다 보이는 프레임에서 자동 학습. 아래는 학습 전 초기값(트랙서 조정 가능).
    lane_width_px: 146.0  # single_anchor 바이어스 = 이 값/2(왼선 anchor: 중심=왼선+W/2). 07-14: 차 정중앙서 offset=0 되도록 실측 튜닝(W=146→offset≈0). 왼선기준: 너무 왼쪽→↑, 너무 오른쪽→↓.
    # 차선폭 자동학습 스위치: true=두 선 보일 때 EMA 재학습(위 값은 초기값), false=끄고
    # lane_width_px 고정값만 사용(학습 표류로 복원폭이 흔들릴 때 잠금). 한쪽 소실 복원·붕괴판정 공통.
    lane_width_learn: false

    # --- 단일 기준선 고정 추종(single_anchor) — 오른선 하나만 추적(붕괴/좌우헷갈림 원천 차단) ---
    # 중심선 = 오른선 − lane_width_px/2. 오른선 소실(점선 갭) 시 anchor_hold_frames 동안
    # 직전 피팅 유지(coast). 지름길 오른선=실선(중간 점선)이라 hold 넉넉히. dual 되돌리려면 false.
    single_anchor: true
    anchor_side: left           # 이 트랙: 오른선이 화면 밖으로 나가 왼선 기준. 중심선 = 왼선 + lane_width_px/2
    anchor_hold_frames: 12      # 점선 갭 견딤(넉넉히). 소실서 반대선 튀면 ↓, 갭서 끊기면 ↑

    # --- 단일-기준선 추종 / 양선 전환 히스테리시스(07-14) ---
    # 우회전 구간처럼 한쪽(왼)만 안정 검출되면 그 선 하나만 추종(중심=선±폭/2, 법선).
    # 반대선(오른쪽)이 min_sep(=lane_collapse_frac×폭) 밖에서 both_enter_frames 연속
    # 검출돼야 양선중심으로 승격 → 반대 없는 쪽으로 튀기(문제1)·합쳐진 창 편향(문제2) 제거.
    lane_collapse_frac: 0.5   # 양선 인정 최소 수평간격 = 이 값×lane_width_px(140px→70px).
    both_enter_frames: 3      # 양선 안정검출 이만큼 연속 → 양선중심 승격(~0.15s@20fps). 승격 늦으면 ↓.
    both_exit_frames: 5       # 한쪽 소실/붕괴 이만큼 연속 → 단일선 강등. 점선 갭에 흔들리면 ↑.
    perp_offset: true         # 한쪽만 볼 때 폭/2 오프셋을 법선(수직)으로. 곡선서 수평오프셋 부족→치우침(우회전 이탈) 방지. false=옛 수평.
    perp_max_slope: 1.5       # 법선 배율 √(1+slope²)의 slope(dx/dy) 절댓값 상한(병적 피팅 오프셋 폭주 방지). 중심이 반대차선 넘으면 ↓.
    yellow_side: right        # 노랑=오른쪽 갈림길 분기선 → 노랑 단일추종 중심=노랑-폭/2(노랑 왼쪽=원 차로 쪽). left면 반대.

    # --- lost 재획득 시 base fallback (07-10) ---
    # 히스토그램 peak 열의 에지량이 (스캔행수×255×seed_min_fill) 미만이면 그쪽 차선을
    # '미검출'로 보고 base를 화면 25%/75%에 고정(argmax가 0/노이즈를 base로 잡는 것 방지).
    # ↑ 노이즈를 차선으로 오인하면(엉뚱한 점 지속) 올리고, 흐린 차선을 자꾸 놓치면 내려.
    seed_min_fill: 0.05
    seed_reacquire_blend: 0.8 # lost 재획득: base = prev*(1-b) + hist_peak*b. 0.5=반반.

    # --- lock 중 히스토그램 블렌딩 (07-10, 기본 off) ---
    # lock(추종 중)에도 매 프레임 hist peak를 seed에 섞어 커브 지연↓. 0.0=off(순수 prev).
    # seed = prev*(1-b) + peak*b. 단, prev ±seed_hist_band_px 밴드 안 peak만·에지량
    # 충분할 때만 섞음(반대차선 점프·garbage 배제). 켤 땐 0.1~0.3, seed 떨리면 낮춰.
    seed_lock_hist_blend: 0.95
    seed_hist_band_px: 90.0    # 위 밴드 폭(±px). 좁을수록 안전(점프 억제), 넓을수록 반응↑.
